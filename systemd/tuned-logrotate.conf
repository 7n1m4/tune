# Rotate the zswap recording history written by `tuned`.
#
# The daemon appends one JSON line per poll; a day of 60s samples is ~1440
# lines, well under a megabyte, so size is not a rotation trigger here.
/var/log/tuned-zswap/stats.jsonl {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
}
