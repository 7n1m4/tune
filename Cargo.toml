[workspace]
# `tune` — kernel memory-reclaim tooling, fused into one daemon.
#
#   crates/tuned         the `tuned` binary: KSM governor + ptrace scanner (async)
#   crates/tuned-zswap   zswap max_pool_percent tuner (std-only, zero deps)
#
# `tuned-zswap` must stay dependency-free (see AGENTS.md), so it remains its own
# crate and inherits no workspace.dependencies. crates/tuned depends on it by
# path to reuse the exact same frozen decision logic.
resolver = "2"
members = ["crates/tuned-common", "crates/tuned", "crates/tuned-zswap"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-journald = "0.3"
nix = { version = "0.29", features = ["mman", "ptrace", "signal", "process", "fs", "uio", "poll"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "fs", "net", "time", "io-util", "sync", "macros"] }
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"

# Matches the release profile tuned-zswap had as a standalone crate.
[profile.release]
opt-level = 2
lto = true
