# animaksm configuration
# Trades CPU cycles for effective RAM by dynamically tuning KSM and memory scanning.

[general]
log_level = "info"
poll_interval_ms = 2000
state_dir = "/var/lib/animaksm"

[governor]
enabled = true
use_advisor = true              # Kernel advisor = primary; governor biases bounds only
psi_some_threshold = 5.0        # avg10 % for ramp-up
psi_full_threshold = 2.0        # avg10 % for critical
advisor_scan_time_range = [30, 600]  # seconds [aggressive, relaxed]
max_page_sharing_range = [256, 1024]
hysteresis_readings = 4         # consecutive readings before level change (both up and down)
min_level_duration_secs = 30   # cooldown before stepping down
stabilization_secs = 30         # per-tier damping: min seconds between repeated actions
ksm_path = "/sys/kernel/mm/ksm"

[scanner]
enabled = true
interval_secs = 30              # how often to scan processes
min_anon_rss_mb = 100           # only consider processes with >100MB anonymous RSS
duplicate_ratio_threshold = 0.15
max_candidates_per_cycle = 5    # top K by RSS per cycle (bounds the ptrace burst)
# Browsers and browser-like runtimes are blocked by default rather than left to
# the operator. Their anonymous heap is dominated by JIT-compiled code, mapped
# and re-forked far faster than a userspace guard can withdraw it, and merging
# executable pages across renderer processes faulted live Chromium with
# `traps: chrome[...] trap invalid opcode` at a fixed .text offset — twice: once
# unguarded, and once with the executable-VMA guard demonstrably firing
# (exec_vmas_protected=403, exec_vmas_reprotected=96). Kernel comm is at most 15
# chars and Chromium sets it to `chrome`; the others cover the same class.
blocklist = ["animaksm", "ksmd", "systemd", "sshd", "chrome", "chromium", "firefox", "msedge", "brave", "opera", "vivaldi", "electron"]
target_cgroups = []             # empty = scan all user processes
