# tuned configuration
# Trades CPU cycles for effective RAM by dynamically tuning KSM and memory scanning.

[general]
log_level = "info"
poll_interval_ms = 2000
state_dir = "/var/lib/tuned"

[governor]
enabled = true
use_advisor = true              # Kernel advisor = primary; governor biases bounds only
psi_some_threshold = 5.0        # avg10 % for ramp-up
psi_full_threshold = 2.0        # avg10 % for critical
advisor_scan_time_range = [30, 600]  # seconds [aggressive, relaxed]
max_page_sharing_range = [256, 1024]
hysteresis_readings = 4         # consecutive readings before level change (both up and down)
min_level_duration_secs = 30   # cooldown before stepping down
stabilization_secs = 30         # per-tier damping: min seconds between repeated actions
ksm_path = "/sys/kernel/mm/ksm"

[scanner]
enabled = true
interval_secs = 30              # how often to scan processes
min_anon_rss_mb = 100           # only consider processes with >100MB anonymous RSS
duplicate_ratio_threshold = 0.15
max_candidates_per_cycle = 5    # top K by RSS per cycle (bounds the ptrace burst)
# Browsers and browser-like runtimes are blocked by default rather than left to
# the operator. Their anonymous heap is dominated by JIT-compiled code, mapped
# and re-forked far faster than a userspace guard can withdraw it, and merging
# executable pages across renderer processes faulted live Chromium with
# `traps: chrome[...] trap invalid opcode` at a fixed .text offset — twice: once
# unguarded, and once with the executable-VMA guard demonstrably firing
# (exec_vmas_protected=403, exec_vmas_reprotected=96). Kernel comm is at most 15
# chars and Chromium sets it to `chrome`; the others cover the same class.
#
# The role comms at the end are load-bearing, not padding. Matching is a
# substring test over the 15-byte comm, so a browser-name entry matches only the
# process that still carries it — Firefox's *content* processes run as
# `Isolated Web Co` or `Web Content`, never `firefox`. Both forms are real and
# live at the same time (5 and 3 processes on 2026-10-15) with identical
# `-contentproc -isForBrowser` cmdlines, so neither substitutes for the other.
# `Isolated Web Co` is the 15-byte truncation of the libxul string
# `Isolated Web Content`; `Web Content` is a separate string set verbatim. A live
# 2026-10-15 run with the shorter list marked six Firefox processes and left
# 90-154 executable VMAs per process unprotected. Do not shorten this list; if
# you must replace it, copy it whole. Never write an entry longer than 15 bytes:
# comm is truncated, so such an entry can never match anything. See AGENTS.md
# "Browser blocklist".
blocklist = ["tuned", "ksmd", "systemd", "sshd", "chrome", "chromium", "firefox", "msedge", "brave", "opera", "vivaldi", "electron", "Isolated Web Co", "Web Content", "WebExtensions", "Socket Process", "RDD Process", "Privileged Cont", "Utility Process", "Crash Reporter"]
target_cgroups = []             # empty = scan all user processes

# The zswap tuner. Note what is *not* here: the 15 s poll, the 10 pp step, the
# [25, 50] clamp, the 2.2/1.5 ratio thresholds and the 3-reading debounce are
# frozen constants inside the tuned-zswap crate, not configuration. They are the
# reason the tool's behaviour is provable, and making them tunable would create
# a second, unverifiable place to change it. See crates/tuned-zswap/README.md.
[zswap]
enabled = true                  # false = leave max_pool_percent alone, record nothing
interval_secs = 0               # 0 = library default (15 s)
record_interval_secs = 0        # 0 = library default (60 s); TUNED_ZSWAP_RECORD_INTERVAL overrides for tests
stats_path = "/var/log/tuned-zswap/stats.jsonl"   # matches LogsDirectory=tuned-zswap in systemd/tuned.service

